<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sajia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #05050d;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .ios-glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        #starCanvas, #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #starCanvas { z-index: 1; }
        #fireworksCanvas { z-index: 9999; }

        /* Lock Screen Countdown */
        #lockScreen {
            position: fixed;
            inset: 0;
            background: #05050d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .countdown-timer {
            font-size: 2.8rem;
            font-weight: 800;
            margin-top: 15px;
            color: #ff2a6d;
            text-shadow: 0 0 25px rgba(255, 42, 109, 0.8);
        }

        /* Animated Cat Banner Wrapper */
        #catBannerWrapper {
            position: fixed;
            top: -600px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            z-index: 8000;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #catBannerWrapper.drop {
            top: 40px;
        }

        #catBannerWrapper.lift {
            top: -650px;
        }

        .cat-icon {
            font-size: 4rem;
            margin-bottom: -15px;
            z-index: 2;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
            animation: catWiggle 1s infinite alternate ease-in-out;
        }

        @keyframes catWiggle {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        .cloth-banner {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(135deg, #180029, #2d0047);
            border: 2px solid #ff2a6d;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(255, 42, 109, 0.5);
        }

        .cloth-banner h1 {
            font-size: 2rem;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ff2a6d;
        }

        /* Main Website Page */
        .main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s;
            position: relative;
            min-height: 100vh;
            padding-bottom: 80px;
            z-index: 2;
        }

        .main-content.active {
            opacity: 1;
            visibility: visible;
        }

        .bg-wallpaper {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1400') center/cover no-repeat;
            z-index: -1;
        }

        .hero-billboard {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            padding: 18px;
            text-align: center;
            border: 2px solid #05d9e8;
            box-shadow: 0 0 25px rgba(5, 217, 232, 0.5);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.85);
        }

        .hero-billboard h2 {
            color: #05d9e8;
            font-size: 1.3rem;
            text-shadow: 0 0 12px #05d9e8;
        }

        .container {
            margin-top: 220px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .section-title {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }

        .sticky-board {
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
        }

        .sticky-note {
            background: rgba(255, 255, 255, 0.12);
            padding: 20px;
            border-radius: 18px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
            border-top: 4px solid #05d9e8;
        }

        .sticky-note:hover {
            transform: translateY(-5px);
        }

        .pin-icon {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .photo-card {
            padding: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 14px;
        }

        .photo-card p {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #ddd;
            text-align: center;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 11000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 450px;
            padding: 25px;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.6rem;
            cursor: pointer;
            color: #fff;
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div id="lockScreen">
        <div class="ios-glass" style="padding: 35px; text-align: center;">
            <h2 style="font-weight: 400; color: #ccc; font-size: 1.2rem;">Sajia's Birthday Countdown</h2>
            <div class="countdown-timer" id="timerDisplay">00d 00h 00m 00s</div>
        </div>
    </div>

    <div id="catBannerWrapper">
        <div class="cat-icon">🐱🐾</div>
        <div class="cloth-banner">
            <h1>HAPPY BIRTHDAY SAJIA</h1>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="bg-wallpaper"></div>

        <div class="hero-billboard">
            <h2 id="billboardText">HAPPY BIRTHDAY SAJIA</h2>
        </div>

        <div class="container">
            <div>
                <h3 class="section-title">📌 Pinned Sticky Notes</h3>
                <div class="sticky-board ios-glass">
                    <div class="sticky-note" onclick="openModal('স্মৃতিগুলো সুন্দর', 'তোর সাথে কাটানো প্রতিটা মুহূর্ত আমার জীবনের সেরা উপহার।')">
                        <span class="pin-icon">📌</span>
                        <h4>স্মৃতিগুলো সুন্দর</h4>
                        <p style="margin-top: 6px; font-size: 0.8rem; color: #bbb;">তোর সাথে কাটানো...</p>
                    </div>
                    <div class="sticky-note" onclick="openModal('তোর মিষ্টি হাসি', 'তোর এক চিলতে হাসি পুরো দিনটাকে আলো করে দেওয়ার জন্য যথেষ্ট ছিল।')">
                        <span class="pin-icon">📌</span>
                        <h4>তোর মিষ্টি হাসি</h4>
                        <p style="margin-top: 6px; font-size: 0.8rem; color: #bbb;">তোর এক চিলতে হাসি...</p>
                    </div>
                    <div class="sticky-note" onclick="openModal('চিরন্তন ভালোবাসা', 'পরিস্থিতি যাই হোক না কেন, তোর প্রতি আমার ভালোবাসা অমলিন থাকবে।')">
                        <span class="pin-icon">📌</span>
                        <h4>চিরন্তন ভালোবাসা</h4>
                        <p style="margin-top: 6px; font-size: 0.8rem; color: #bbb;">পরিস্থিতি যাই হোক...</p>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="section-title">📸 10 Special Memories</h3>
                <div class="gallery-grid" id="galleryGrid"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modalWindow">
        <div class="modal-content ios-glass">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" style="width: 100%; height: 220px; object-fit: cover; border-radius: 14px; display: none; margin-bottom: 12px;" alt="Memory">
            <h3 id="modalTitle" style="color: #ff2a6d; margin-bottom: 8px;"></h3>
            <p id="modalBody" style="line-height: 1.5; color: #eee; font-size: 0.95rem;"></p>
        </div>
    </div>

    <script>
        const targetDate = new Date("September 5, 2026 15:04:00").getTime();

        // Background Stars
        const starCanvas = document.getElementById("starCanvas");
        const starCtx = starCanvas.getContext("2d");
        let stars = [];

        function resizeStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeStars);
        resizeStars();

        for (let i = 0; i < 70; i++) {
            stars.push({ x: Math.random() * starCanvas.width, y: Math.random() * starCanvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 1 + 0.3 });
        }

        function animateStars() {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            starCtx.fillStyle = "#ffffff";
            stars.forEach(s => {
                starCtx.beginPath();
                starCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                starCtx.fill();
                s.y += s.speed;
                if (s.y > starCanvas.height) { s.y = 0; s.x = Math.random() * starCanvas.width; }
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // 5 Seconds Fireworks Animation
        const fwCanvas = document.getElementById("fireworksCanvas");
        const fwCtx = fwCanvas.getContext("2d");
        let particles = [];

        function resizeFw() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
        window.addEventListener("resize", resizeFw);
        resizeFw();

        function createExplosion(x, y) {
            const colors = ['#ff2a6d', '#05d9e8', '#ffdf00', '#00ff88', '#ffffff'];
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    radius: Math.random() * 2.5 + 1,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    gravity: 0.12,
                    alpha: 1,
                    decay: 0.02
                });
            }
        }

        function animateFireworks() {
            fwCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

            particles.forEach((p, idx) => {
                if (p.alpha > 0) {
                    fwCtx.save();
                    fwCtx.globalAlpha = p.alpha;
                    fwCtx.beginPath();
                    fwCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    fwCtx.fillStyle = p.color;
                    fwCtx.fill();
                    fwCtx.restore();

                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.alpha -= p.decay;
                } else {
                    particles.splice(idx, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        function trigger5SecFireworks() {
            let timer = setInterval(() => {
                createExplosion(Math.random() * fwCanvas.width, Math.random() * (fwCanvas.height * 0.5));
            }, 200);
            setTimeout(() => clearInterval(timer), 5000);
        }

        // Timer & Unlock Logic
        const timerDisplay = document.getElementById("timerDisplay");
        const lockScreen = document.getElementById("lockScreen");
        const catBannerWrapper = document.getElementById("catBannerWrapper");
        const mainContent = document.getElementById("mainContent");

        const countdown = setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                clearInterval(countdown);
                unlockWebsite();
            } else {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                timerDisplay.innerText = `${d}d ${h}h ${m}m ${s}s`;
            }
        }, 1000);

        function unlockWebsite() {
            lockScreen.style.opacity = "0";
            setTimeout(() => {
                lockScreen.style.visibility = "hidden";
                
                catBannerWrapper.classList.add("drop");

                setTimeout(() => {
                    catBannerWrapper.classList.remove("drop");
                    catBannerWrapper.classList.add("lift");

                    mainContent.classList.add("active");
                    trigger5SecFireworks();

                }, 10000);

            }, 800);
        }

        // Rotating Billboard Text (30 Seconds)
        const billboardText = document.getElementById("billboardText");
        let isAltText = false;
        setInterval(() => {
            billboardText.style.opacity = "0";
            setTimeout(() => {
                isAltText = !isAltText;
                billboardText.innerText = isAltText ? "আজও ভালবাসি তোমায়" : "HAPPY BIRTHDAY SAJIA";
                billboardText.style.opacity = "1";
            }, 500);
        }, 30000);

        // 10 Photos Grid
        const photoGallery = [
            { img: "https://via.placeholder.com/400x300/ff2a6d/ffffff?text=Photo+1", note: "১. তোর সেই মিষ্টি হাসিটা আজও সেরা।" },
            { img: "https://via.placeholder.com/400x300/05d9e8/ffffff?text=Photo+2", note: "২. একসাথে কাটানো সুন্দর বিকেলগুলোর স্মৃতি।" },
            { img: "https://via.placeholder.com/400x300/ffdf00/ffffff?text=Photo+3", note: "৩. তোর প্রতিটি কথা আমার খুব পছন্দের।" },
            { img: "https://via.placeholder.com/400x300/00ff88/ffffff?text=Photo+4", note: "৪. অভিমানী রূপটাতে তোকে সবচেয়ে সুন্দর লাগতো।" },
            { img: "https://via.placeholder.com/400x300/ff2a6d/ffffff?text=Photo+5", note: "৫. তোর স্বপ্নগুলো সত্যি হোক সবসময়।" },
            { img: "https://via.placeholder.com/400x300/7928ca/ffffff?text=Photo+6", note: "৬. দূরত্ব বাড়লেও ভালোবাসা কমেনি।" },
            { img: "https://via.placeholder.com/400x300/05d9e8/ffffff?text=Photo+7", note: "৭. তোর সাথে কাটানো সময়গুলো অমূল্য।" },
            { img: "https://via.placeholder.com/400x300/ffdf00/ffffff?text=Photo+8", note: "৮. ভালো থাকিস তুই নিজের মতো করে।" },
            { img: "https://via.placeholder.com/400x300/00ff88/ffffff?text=Photo+9", note: "৯. জীবনের প্রতিটি ধাপে সফলতা আসুক।" },
            { img: "https://via.placeholder.com/400x300/ff2a6d/ffffff?text=Photo+10", note: "১০. আই লাভ ইউ সাজিয়া—আজ এবং সারাজীবন।" }
        ];

        const galleryGrid = document.getElementById("galleryGrid");
        photoGallery.forEach((item, idx) => {
            const card = document.createElement("div");
            card.className = "photo-card ios-glass";
            card.onclick = () => openImageModal(item.img, `Memory #${idx + 1}`, item.note);
            card.innerHTML = `<img src="${item.img}" alt="Memory"><p>${item.note}</p>`;
            galleryGrid.appendChild(card);
        });

        function openModal(title, text) {
            document.getElementById("modalImg").style.display = "none";
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalBody").innerText = text;
            document.getElementById("modalWindow").classList.add("active");
        }

        function openImageModal(src, title, text) {
            const img = document.getElementById("modalImg");
            img.src = src;
            img.style.display = "block";
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalBody").innerText = text;
            document.getElementById("modalWindow").classList.add("active");
        }

        function closeModal() {
            document.getElementById("modalWindow").classList.remove("active");
        }
    </script>
</body>
</html>
